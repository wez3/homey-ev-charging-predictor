name: Publish to Homey App Store

# Runs on every push to main that touches the app, and can also be started by
# hand from the Actions tab (to pick minor/major or write the changelog).
# Bumps the version, uploads the build to the Homey App Store, then commits
# and tags the new version on main. That bump commit is pushed with the
# built-in GITHUB_TOKEN, which GitHub never lets trigger another workflow run,
# so this cannot loop.
#
# The upload lands as a Draft. Releasing it to Test is one click in the
# Developer Portal (the job summary links straight to it); Athom offers no
# Action or documented API for that step.
#
# Needs a repository secret HOMEY_PAT: a personal access token from
# https://tools.developer.homey.app/me

on:
  push:
    branches: [main]
    # Changes that don't alter the app itself don't need a new build.
    paths-ignore:
      - '.github/**'
      - 'test/**'
      - 'README.md'
      - 'TESTING.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version bump
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      changelog:
        type: string
        description: Changelog (English, shown in the App Store). Empty = commit subjects since the last release.
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tags and history, for the changelog

      - name: Check HOMEY_PAT secret
        env:
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: |
          if [ -z "$HOMEY_PAT" ]; then
            echo "::error::Repository secret HOMEY_PAT is not set. Create a token at https://tools.developer.homey.app/me and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # A manual run uses what was typed; an automatic run is a patch release
      # whose changelog is the commit subjects since the last version tag
      # (merge commits and earlier version bumps left out).
      - name: Changelog
        id: changelog
        env:
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -n "$INPUT_CHANGELOG" ]; then
            text="$INPUT_CHANGELOG"
          else
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            range=${last:+$last..}HEAD
            text=$(git log --no-merges --format=%s "$range" \
              | grep -v -E '^(Bump|Update Homey App) [Vv]ersion' \
              | head -n 10 | paste -sd ';' - | sed 's/;/; /g') || true
          fi
          [ -n "$text" ] || text="Maintenance update"
          echo "text=${text:0:400}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        uses: athombv/github-action-homey-app-version@master
        id: version
        with:
          version: ${{ inputs.version || 'patch' }}
          changelog: ${{ steps.changelog.outputs.text }}

      - name: Validate app (publish level)
        run: npx homey app validate --level publish

      - name: Publish
        uses: athombv/github-action-homey-app-publish@master
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      # Only after a successful upload, so a failed publish never leaves a
      # version bump on main without a matching build.
      - name: Commit & tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump version to v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          # Someone may have pushed to main during the run; their commit
          # triggers its own (queued) publish run, this one just lands on top.
          git pull --rebase origin main
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main --tags

      - name: Summary
        run: |
          {
            echo "### v${{ steps.version.outputs.version }} uploaded as Draft"
            echo ""
            echo "Changelog: ${{ steps.changelog.outputs.text }}"
            echo ""
            echo "Release it to **Test** here: ${{ steps.publish.outputs.url }}"
            echo ""
            echo "Test link: https://homey.app/a/com.evcharging.predictor/test/"
          } >> "$GITHUB_STEP_SUMMARY"
