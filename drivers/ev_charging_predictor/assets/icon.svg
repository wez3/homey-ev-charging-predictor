<?xml version="1.0" encoding="UTF-8"?>
<!--
  EV Charging Predictor app icon - original artwork for this project.

  A clock face with a lightning bolt in place of hands: this app predicts the
  *timing* of charging, so the two ideas are combined rather than drawing yet
  another charging station (which is also what Athom's own car-charger icon
  already is).

  Follows Athom's device-icon conventions so it sits alongside them: 960x960
  viewBox, solid black, no background fill. Homey renders an app's icon.svg as
  a themed mask rather than a literal image, so any background shape would
  flatten into a single solid blob.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <circle cx="480" cy="480" r="360" fill="none" stroke="#000000" stroke-width="72"/>
  <g fill="#000000">
    <!-- hour markers at 12 / 3 / 6 / 9 -->
    <rect x="456" y="170" width="48" height="60"/>
    <rect x="456" y="730" width="48" height="60"/>
    <rect x="730" y="456" width="60" height="48"/>
    <rect x="170" y="456" width="60" height="48"/>
    <!-- bolt, in place of the hands -->
    <path d="M545 225 L380 520 L468 520 L410 755 L590 450 L500 450 Z"/>
  </g>
</svg>
